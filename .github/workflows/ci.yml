name: CI

on:
  push:
    branches: [main]
    paths:
      - "JustTeams-Fabric/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "JustTeams-Fabric/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: JustTeams-Fabric/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        working-directory: JustTeams-Fabric
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
